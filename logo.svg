<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#053b8c"/>
      <stop offset="100%" stop-color="#010e28"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0056cc"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe800"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)" stroke="url(#cyanGlow)" stroke-width="8" filter="url(#glowEffect)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="rgba(0, 229, 255, 0.3)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Speed Fiber Waves / Signal Icon -->
  <path d="M 130 250 A 140 140 0 0 1 370 250" fill="none" stroke="url(#cyanGlow)" stroke-width="16" stroke-linecap="round" filter="url(#glowEffect)"/>
  <path d="M 165 205 A 100 100 0 0 1 335 205" fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 160 A 60 60 0 0 1 300 160" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Center Fiber Node Dot -->
  <circle cx="250" cy="120" r="16" fill="url(#cyanGlow)" filter="url(#glowEffect)"/>

  <!-- Main Title: HIGH-SPEED -->
  <text x="250" y="325" font-family="'Teko', 'Montserrat', sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    HIGH-SPEED
  </text>

  <!-- Sub Title: UNLIMITED INTERNET -->
  <text x="250" y="365" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="url(#cyanGlow)" text-anchor="middle" letter-spacing="3">
    UNLIMITED INTERNET
  </text>

  <!-- Location Badge -->
  <rect x="150" y="392" width="200" height="30" rx="15" fill="url(#goldGradient)"/>
  <text x="250" y="412" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#010e28" text-anchor="middle" letter-spacing="2">
    ANTIPOLO
  </text>
</svg>
